[project]
name = "namastex-test-tecnico"
version = "0.1.0"
description = "Agente de vendas de seguro auto — AutoSeguro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "pyarrow>=18,<24",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"infrastructure.persistence" = ["schema.sql"]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --import-mode=importlib"
markers = ["slow: corpus completo e simulações; excluir do loop de TDD", "eval: avaliação LLM gravada ou reproduzida; também slow"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
